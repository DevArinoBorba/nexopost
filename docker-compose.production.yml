services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexopost-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexopost.rule=Host(`nexopost.oriumdigital.tech`)
      - traefik.http.routers.nexopost.entrypoints=https
      - traefik.http.routers.nexopost.tls=true
      - traefik.http.routers.nexopost.tls.certresolver=letsencrypt
      - traefik.http.routers.nexopost.service=nexopost
      - traefik.http.services.nexopost.loadbalancer.server.port=3000
      - traefik.http.routers.nexopost-http.rule=Host(`nexopost.oriumdigital.tech`)
      - traefik.http.routers.nexopost-http.entrypoints=http
      - traefik.http.routers.nexopost-http.middlewares=nexopost-https
      - traefik.http.middlewares.nexopost-https.redirectscheme.scheme=https
      - traefik.docker.network=coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  coolify:
    external: true
    name: coolify
